model_type: "openpi"

# Model path - should be set in specific config files
model_path: "/path/to/model/openpi_meanflow"

precision: null # for openpi, precision is null, please do not change this value

# Action and chunk settings
num_action_chunks: 10
action_dim: 7

# LoRA settings
is_lora: False
lora_rank: 32

# Training settings
use_proprio: True
num_steps: 5
add_value_head: False

# openpi meanflow specific parameters
openpi:
  config_name: "pi05_libero_meanflow"
  num_images_in_input: 2
  action_chunk: ${..num_action_chunks}
  num_steps: ${..num_steps}
  train_expert_only: True
  action_env_dim: ${..action_dim}
  add_value_head: ${..add_value_head}
  noise_method: "flow_ode"
  noise_level: 0.5
  noise_logvar_range: [0.08, 0.16]
  safe_get_logprob: False
  joint_logprob: True
  ignore_last: False
  value_after_vlm: False
  value_vlm_mode: "mean_token"
  detach_critic_input: False
  chunk_critic_input: False
  meanflow_init_scope: "all_compatible"
