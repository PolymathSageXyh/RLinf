defaults:
  - env/realworld_peg_insertion@env.eval
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env:
      node_group: franka
      placement: 0
  node_groups:
    - label: franka
      node_ranks: 0
      hardware:
        type: Franka
        configs:
          - robot_ip: 172.16.0.4    # Replace with your Franka IP
            camera_type: "realsense"
            camera_serials:
              - "230322276572"
              - "230322274001"
              # Keep the second D405 disabled: it shares the robot NIC's USB
              # controller and is not used by camera_names below.
              # - "230322274001"
            node_rank: 0

runner:
  task_type: embodied
  logger:
    log_path: "/workspace/RLinf/dataset_xyh_spacemouse_test"    # Replace with your log path, where the dataset will be saved
    project_name: rlinf
    experiment_name: "collect-data-spacemouse_test"
    logger_backends: null # wandb, swanlab
  num_data_episodes: 50
  record_task_description: False

env:
  group_name: "EnvGroup"
  eval:
    no_gripper: False
    ignore_terminations: False
    auto_reset: False
    use_spacemouse: True
    use_gello: False
    #gello_port: "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0"  # Replace with your GELLO serial port
    keyboard_reward_wrapper: single_stage
    # After every reset, wait for "s" before recording. During recording:
    # "a" = failure/end, "b" = neutral/continue, "c" = success/end.
    keyboard_start_key: "s"
    override_cfg:
      target_ee_pose: [0.5, 0.0, 0.25, -3.14, 0.0, 0.0]   # Replace with your task pose
      success_hold_steps: 1
      camera_names:
        "230322276572": "front"
        "230322274001": "wrist"
      # 424x240 still exceeds the stored 128x128 observation while reducing
      # RealSense USB traffic to one third of the 640x480 default.
      camera_resolution: [424, 240]
      camera_fps: 15
      enable_camera_player: false

    data_collection:
      enabled: True
      save_dir: ${runner.logger.log_path}/collected_data
      export_format: "lerobot"      # or "pickle"
      only_success: True
      robot_type: "panda"
      fps: 10
