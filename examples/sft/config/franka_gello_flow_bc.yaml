defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 6-6

runner:
  task_type: sft
  logger:
    log_path: "/nas/xyh/RLinf/results/flow_bc"
    project_name: rlinf
    experiment_name: "franka_gello_flow_bc_30000"
    logger_backends: ["wandb"]
  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 1000
  resume_dir: null

data:
  # GELLO collection root produced by realworld_collect_data_gello.yaml.
  train_data_paths: "/nas/xyh/data/data_pick_cube/collected_data"
  val_data_paths: null
  format: "lerobot"
  state_key: "state"
  action_key: "actions"
  image_keys: ["image", "extra_view_image"]
  image_value_range: "zero_one"
  fps: 10
  min_frames: 1
  num_workers: 0
  pin_memory: true
  use_random_replacement: true
  num_samples_per_epoch: 3200

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: false

  model:
    model_type: "flow_policy"
    input_type: "mixed"
    image_size: [3, 128, 128]
    image_num: 2
    state_dim: 19
    action_dim: 7
    num_action_chunks: 1
    action_scale: [-1.0, 1.0]

    model_path: "/nas/xyh/RLinf/.cache/flow_bc/RLinf-ResNet10-pretrained"
    backbone: "resnet"
    encoder_config:
      ckpt_name: "resnet10_pretrained.pt"

    precision: "32"
    add_value_head: false
    add_q_head: false
    flow_actor_type: "FlowTActor"
    denoising_steps: 4
    d_model: 256
    n_head: 4
    n_layers: 2
    use_batch_norm: false
    batch_norm_momentum: 0.99

    flow_matching:
      implementation: "pytorch_flow_t_v2"
      objective: "improved_meanflow"
      action_transform: "tanh_latent"
      improved_meanflow:
        boundary_pair_probability: 0.5
        logit_mean: -0.4
        logit_std: 1.0
        adaptive_power: 0.5
        adaptive_epsilon: 0.001
        time_conditioning:
          from_encoder: "independent_mlp"
          to_encoder: "independent_mlp"
          fusion: "concat_linear_2d_to_d"

    gradient_checkpointing: false
    is_lora: false
    lora_rank: 32

  optim:
    lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.0
    clip_grad: 1.0
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: true
    save_full_model_weights: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
