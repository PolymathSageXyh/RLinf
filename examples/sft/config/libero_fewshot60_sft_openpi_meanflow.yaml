defaults:
  - model/pi0_meanflow@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-0

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_fewshot60_sft_openpi_meanflow_smoke"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 1
  val_check_interval: -1
  save_interval: -1

data:
  train_data_paths: "/data0/vla_dataset/libero/libero-v2/libero_fewshot_60_sp1_ob1_go1_lo3_seed0"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2
  global_batch_size: 2
  seed: 0

  model:
    precision: null
    model_path: "/buaa/xyh/xyh/openpi/checkpoints/pi05_libero_base"
    num_action_chunks: 10
    add_value_head: False
    openpi:
      config_name: "pi05_libero_meanflow"
      train_expert_only: True
      meanflow_init_scope: "vlm_only"
      detach_critic_input: True

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    warmup_style: "cosine"
    lr_warmup_steps: 1000
    total_training_steps: 30000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: True
    checkpoint_format: "trainable_only"
    save_full_model_weights: True
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
