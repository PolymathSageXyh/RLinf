defaults:
  - env/libero_10@env.eval
  - model/pi0_meanflow@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 5

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_10_openpi_pi05_eval_fewshot"
    logger_backends: null

  max_epochs: 1
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 1
    total_num_envs: 50
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 520
    max_steps_per_rollout_epoch: 5200
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "/nas/xyh/RLinf/logs/20260813-19:29:50-libero_10_ppo_openpi_meanflow_pi05_quickstart/libero_10_ppo_openpi_meanflow_pi05_quickstart_2NFE/checkpoints/global_step_800/actor" # https://huggingface.co/RLinf/RLinf-Pi05-LIBERO-SFT
    model_type: "openpi"
    num_action_chunks: 10
    num_steps: 2
    openpi:
      config_name: pi05_libero_meanflow
